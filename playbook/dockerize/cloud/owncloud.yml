---
# Deploy OwnCloud + MySQL
- name: Deploy OwnCloud
  hosts: localhost
  become: yes

  vars:
    deploy_dir: /opt/owncloud

  tasks:
    - name: Create deploy directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Write docker-compose.yml
      copy:
        dest: "{{ deploy_dir }}/docker-compose.yml"
        content: |
          services:
            db:
              image: mysql:8.0
              container_name: owncloud_db
              volumes:
                - db_data:/var/lib/mysql
              environment:
                MYSQL_ROOT_PASSWORD: rootpassword
                MYSQL_DATABASE: owncloud
                MYSQL_USER: ocuser
                MYSQL_PASSWORD: ocpassword
              restart: unless-stopped

            owncloud:
              image: owncloud/server:latest
              container_name: owncloud
              depends_on:
                - db
              volumes:
                - oc_data:/mnt/data
              ports:
                - "80:80"
              environment:
                OWNCLOUD_DOMAIN: localhost
                OWNCLOUD_DB_TYPE: mysql
                OWNCLOUD_DB_HOST: db
                OWNCLOUD_DB_NAME: owncloud
                OWNCLOUD_DB_USERNAME: ocuser
                OWNCLOUD_DB_PASSWORD: ocpassword
                OWNCLOUD_ADMIN_USERNAME: admin
                OWNCLOUD_ADMIN_PASSWORD: adminpassword
              restart: unless-stopped

          volumes:
            db_data:
            oc_data:

    - name: Build and start containers
      command: docker compose up -d --build
      args:
        chdir: "{{ deploy_dir }}"

    - name: Open firewall port
      ufw:
        rule: allow
        port: "80"
        proto: tcp
