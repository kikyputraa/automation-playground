---
# Deploy Node Exporter sebagai container
- name: Deploy Node Exporter
  hosts: localhost
  become: yes

  vars:
    deploy_dir: /opt/node_exporter

  tasks:
    - name: Create deploy directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Write docker-compose.yml
      copy:
        dest: "{{ deploy_dir }}/docker-compose.yml"
        content: |
          services:
            node-exporter:
              image: prom/node-exporter:v1.9.0
              container_name: node_exporter
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/rootfs:ro
              command:
                - '--path.procfs=/host/proc'
                - '--path.sysfs=/host/sys'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
              ports:
                - "9100:9100"
              restart: unless-stopped

    - name: Build and start container
      command: docker compose up -d --build
      args:
        chdir: "{{ deploy_dir }}"

    - name: Open Node Exporter port through UFW
      ufw:
        rule: allow
        port: "9100"
        proto: tcp
