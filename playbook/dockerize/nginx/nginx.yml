---
# Deploy Nginx sebagai container
- name: Deploy Nginx
  hosts: localhost
  become: yes

  vars:
    deploy_dir: /opt/nginx

  tasks:
    - name: Create deploy directory
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: '0755'

    - name: Write docker-compose.yml
      copy:
        dest: "{{ deploy_dir }}/docker-compose.yml"
        content: |
          services:
            nginx:
              image: nginx:latest
              container_name: nginx
              volumes:
                - nginx_data:/usr/share/nginx/html
              ports:
                - "80:80"
              restart: unless-stopped

          volumes:
            nginx_data:

    - name: Build and start container
      command: docker compose up -d --build
      args:
        chdir: "{{ deploy_dir }}"

    - name: Open firewall port
      ufw:
        rule: allow
        port: "80"
        proto: tcp
