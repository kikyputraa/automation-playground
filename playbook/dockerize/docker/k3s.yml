---
# Install K3s sebagai lightweight Kubernetes cluster
- name: Install K3s
  hosts: localhost
  become: yes

  tasks:
    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Install dependencies
      apt:
        name:
          - curl
          - ca-certificates
        state: present

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 60

    - name: Set up kubeconfig for current user
      shell: |
        mkdir -p $HOME/.kube
        cp /etc/rancher/k3s/k3s.yaml $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Verify K3s is running
      command: k3s kubectl get nodes
      register: k3s_nodes

    - name: Show nodes
      debug:
        var: k3s_nodes.stdout_lines

    - name: Open K3s API port through UFW
      ufw:
        rule: allow
        port: "6443"
        proto: tcp
